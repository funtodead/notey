<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#27243a"/>
      <stop offset="1" stop-color="#0d0c12"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43405a"/>
      <stop offset="1" stop-color="#2d2b3a"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302d40"/>
      <stop offset="1" stop-color="#22202d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a79df5"/>
      <stop offset="1" stop-color="#6c62c9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- A second note tilted behind, for a little depth -->
  <rect x="122" y="128" width="232" height="284" rx="44" fill="url(#back)" transform="rotate(-11 238 270)"/>

  <!-- The front note -->
  <rect x="140" y="112" width="236" height="292" rx="44" fill="url(#card)"/>
  <rect x="141" y="113" width="234" height="290" rx="43" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="180" y="176" width="140" height="22" rx="11" fill="url(#accent)"/>
  <rect x="180" y="232" width="156" height="22" rx="11" fill="#5c5873"/>
  <rect x="180" y="288" width="98" height="22" rx="11" fill="#5c5873"/>

  <!-- AI spark on the corner: outlined in the background color so it sits cleanly on the card -->
  <path d="M372 318 Q372 382 436 382 Q372 382 372 446 Q372 382 308 382 Q372 382 372 318 Z" fill="url(#accent)" stroke="#16141d" stroke-width="14" stroke-linejoin="round" paint-order="stroke"/>
  <path d="M430 286 Q430 310 454 310 Q430 310 430 334 Q430 310 406 310 Q430 310 430 286 Z" fill="#b6adf7"/>
</svg>
